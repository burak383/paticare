name: Android APK derle

# EAS'ın bulut build kotasına/hesap kurulumuna bağlı kalmadan, tamamen
# ücretsiz bir GitHub Actions Linux runner'ında native Android projesini
# üretip (expo prebuild — bu proje "managed" workflow olduğu için android/
# klasörü repoda yok, her seferinde burada üretiliyor) Gradle ile bir APK
# derler.
#
# "release" build type kullanıyoruz (debug DEĞİL): debug tipi APK'lar JS
# kodunu içine gömmez, çalışırken bilgisayardaki Metro sunucusuna bağlanmayı
# bekler — telefonda tek başına açılınca "Unable to load script" hatası
# verir. Henüz kendi release keystore'umuzu tanımlamadığımız için (bkz.
# build-android-release.yml) bu "release" derleme otomatik olarak debug
# keystore'uyla imzalanıyor — yani hâlâ Play Store'a YÜKLENEMEZ, ama JS kodu
# APK'nın içine gömülü olduğundan telefona kurup Metro'suz, doğrudan test
# edilebilir. Gerçek mağaza gönderimi için hâlâ `eas build --profile
# production` ya da build-android-release.yml (kendi release keystore'unla
# imzalama) gerekiyor.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://paticare-backend.onrender.com/api
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: 259953766035-i7t7uga8l4hmvat8755kntk460c6ok2n.apps.googleusercontent.com

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: mobile
        run: npm ci

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Native Android projesini oluştur (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: gradlew'i çalıştırılabilir yap
        run: chmod +x mobile/android/gradlew

      - name: APK derle (release build type, debug keystore ile imzalı)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK'yı Actions artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: paticare-test-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14