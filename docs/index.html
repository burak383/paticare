<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PatiCare — Belgeler</title>
<style>
  :root {
    --bg: #F7FBF8;
    --fg: #17352C;
    --primary: #087F5B;
    --primary-fg: #FFFFFF;
    --muted-fg: #587168;
    --border: #CFE1D8;
    --card: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1C17; --fg: #E7F3ED; --primary: #3FCB9B; --primary-fg: #062E22;
      --muted-fg: #9BB8AC; --border: #26402F; --card: #142720;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1C17; --fg: #E7F3ED; --primary: #3FCB9B; --primary-fg: #062E22;
    --muted-fg: #9BB8AC; --border: #26402F; --card: #142720;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 64px 24px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--primary); color: var(--primary-fg);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .brand-name { font-weight: 800; font-size: 18px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  li a {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
  }
  li a:hover { border-color: var(--primary); }
  li span { display: block; color: var(--muted-fg); font-weight: 400; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">🐾</div>
    <div class="brand-name">PatiCare</div>
  </div>
  <h1>Genel belgeler</h1>
  <ul>
    <li>
      <a href="./gizlilik-politikasi.html">Gizlilik politikası
        <span>KVKK Aydınlatma Metni — hangi veriler toplanıyor ve neden (TASLAK)</span>
      </a>
    </li>
    <li>
      <a href="./hesap-silme.html">Hesap ve veri silme
        <span>Google Play'in gerektirdiği bağımsız hesap silme sayfası</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
